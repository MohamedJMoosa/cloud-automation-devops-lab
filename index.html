<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudOps Status Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }

    main {
      width: min(600px, 90%);
      padding: 32px;
      border-radius: 16px;
      background: #1e293b;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.3);
    }

    h1 {
      margin-top: 0;
    }

    .status {
      color: #86efac;
      font-weight: bold;
    }

    .deployment {
      margin-top: 24px;
      padding: 14px;
      border-left: 4px solid #38bdf8;
      background: #0f172a;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <main>
    <h1>CloudOps Status Dashboard</h1>
    <p class="status">&#9679; All systems operational</p>
    <p>Containerized application running on AWS EC2.</p>

    <div class="deployment">
      Version 2 — Deployed automatically with GitHub Actions
    </div>
  </main>
</body>
</html>
